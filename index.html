<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Lovie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="cake-wrapper">
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>
      <div class="layer layer-top">
        <div class="icing"></div>
      </div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-bottom"></div>
      <div class="plate"></div>
    </div>

    <div class="text-content">
      <h1 class="main-title">Happy Birthday</h1>
      <h2 class="name">LOVIE😘</h2>
      <p class="wish">MAY ALL YOUR WISHES COME TRUE</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
